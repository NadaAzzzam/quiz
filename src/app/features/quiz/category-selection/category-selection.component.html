<div class="container mt-5">
  <h2 class="text-center mb-4 fs-3">Select a Quiz Category</h2>
  <div class="row">
    <div
      class="col-sm-6 col-md-4 col-lg-3 mb-4"
      *ngFor="let category of categories"
    >
      <div
        class="card h-100 shadow-sm"
        (click)="selectCategory(category)"
        style="cursor: pointer;"
      >

        <div class="card-body d-flex flex-column">
          <h5 class="card-title text-center fw-bold">{{ category }}</h5>
          <div class="mt-auto">
            <button class=" w-100" (click)="selectCategory(category)">Start Quiz</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
